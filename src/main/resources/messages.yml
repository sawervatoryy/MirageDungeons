# --- справка
help:
  - "&b&lMirageDungeons &fv0.1"
  - "&b/randomdang spawn <random|1-5|dang1> [мир|here] &f— создать данж"
  - "&b/randomdang list &f— список данжей"
  - "&b/randomdang info <id> &f— подробности о данже"
  - "&b/randomdang open <id> &f— имитировать рейд (уничтожить ядро)"
  - "&b/randomdang validate &f— проверить конфиг, схематики и лут"
  - "&b/randomdang tp <id> &f— телепорт к данжу"
  - "&b/randomdang remove <id> &f— удалить данж с откатом"
  - "&b/randomdang removeall &f— удалить все данжи"
  - "&b/randomdang compass [игрок] &f— выдать компас"
  - "&b/randomdang key <уровень> [игрок] [кол-во] &f— выдать ключ"
  - "&b/randomdang loot gui <уровень> &f— редактор лута в виде сундука"
  - "&b/randomdang loot <add|list|remove|clear|amount> <уровень> ... &f— лут командами"
  - "&b/randomdang regions &f— создать недостающие регионы WorldGuard и обновить флаги у существующих"
  - "&b/randomdang top &f— топ грабителей"
  - "&b/randomdang reload &f— перезагрузить конфиги"
help-player: "Доступна команда: &b/randomdang top"
usage-spawn: "Использование: &b/randomdang spawn <random|уровень|dang1> [мир|here]"
